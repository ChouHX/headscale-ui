services:
  headscale-ui:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_BASE_PATH: ${VITE_BASE_PATH:-/}
    image: headscale-ui:local
    container_name: headscale-ui
    ports:
      - "${UI_PORT:-8080}:8080"
    environment:
      HOST: 0.0.0.0
      PORT: 8080
    restart: unless-stopped
